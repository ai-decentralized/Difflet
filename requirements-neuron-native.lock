# requirements-neuron-native.lock: the TorchNeuron venv for DIFFLET_BACKEND=neuron
# (/home/ubuntu/workspace/native_venv). PyTorch-native neuron device: no torch_xla,
# neuronx_distributed or NxDI. Not interchangeable with requirements-neuron.lock,
# which pins the Trainium AoT (torch-xla) venv.
#
# Python: CPython 3.14.8 (uv-managed venv).
# Indexes: PyPI, plus
#   https://download.pytorch.org/whl/cpu      (torch==2.14.0+cpu)
#   https://pip.repos.neuron.amazonaws.com    (Neuron packages)
# Not listed below (pip freeze --exclude-editable drops editable installs):
#   torch-neuronx==2.14.3.0.0+unknown.dev, an editable install of
#   /home/ubuntu/workspace/torch_neuron_eager (pip install -e).
# neuronx-cc and nki are recorded as the local cp314 wheels they were installed from.
# difflet itself is not installed; run with PYTHONPATH=<repo root>.
#
# The HF stack was added on top of the toolchain under a constraints file pinning
# torch, torch-neuronx, neuronx-cc, nki and numpy, so pip could not replace them:
#   python -m pip install --only-binary=:all: -c <constraints> diffusers==0.38.0 \
#     transformers==4.57.6 safetensors==0.8.0 tokenizers==0.22.2 sentencepiece==0.2.2 \
#     huggingface_hub==0.36.2 accelerate==1.14.0 av==18.1.0 imageio==2.37.4 \
#     imageio-ffmpeg==0.6.0
