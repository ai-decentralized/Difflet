name: Feature request
description: Suggest a new model, parallelism mode, backend, or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working (CLI flags, API, serving behavior).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a pull request for this.
