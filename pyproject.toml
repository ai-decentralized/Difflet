[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "difflet-diffusion"
version = "0.0.0.dev0"
description = "Trainium3-native diffusion inference framework"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
]

# Versions pinned to the toolchain on the validated nxdi_inference venv
# (/opt/aws_neuronx_venv_pytorch_2_9_nxd_inference). Bump in lockstep when
# upgrading the Neuron stack.
dependencies = [
    # Neuron toolchain (Layer 3 — kept as deps, not forked)
    "torch>=2.9.0,<2.10",
    "torch-neuronx==2.9.0.2.14.27725+e2ff0410",
    "torch-xla==2.9.0",
    "neuronx-cc==2.25.3371.0+f524f7f8",         # ships nkilib bundled
    "neuronx-distributed==0.19.28093+fc70b593",
    "nki==0.4.0+25940409122.gd30719f9",
    "libneuronxla==2.2.16974.0+a550bfe0",

    # HuggingFace stack
    "transformers==4.57.6",
    "diffusers>=0.38.0",                          # latest stable; NxDI Flux requires diffusers but doesn't pin it
    "huggingface_hub>=0.36.0",
    "safetensors>=0.7.0",
    "tokenizers>=0.22.0",
    "sentencepiece>=0.2.0",                       # for T5 / umT5 tokenizers

    # Misc
    "numpy",
    "Pillow",
    "einops",
    "accelerate",
    "av",                                         # for video I/O (Wan/Hunyuan output)
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-xdist",
    "expecttest",
    "imageio",
    "imageio-ffmpeg",
]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.35",
    "boto3>=1.34",
]
dev = [
    "difflet-diffusion[test]",
    "difflet-diffusion[serve]",
    "black==26.1.0",
    "isort==8.0.1",
    "ruff==0.15.1",
    "libcst",                                     # AST-level import rewriter (M0.5)
    "pre-commit",
]

[project.urls]
"Source" = "https://github.com/<org>/difflet-diffusion"          # placeholder
"Tracker" = "https://github.com/<org>/difflet-diffusion/issues"  # placeholder

[project.scripts]
difflet = "difflet.cli.main:main"

[tool.setuptools.packages.find]
include = ["difflet*"]
exclude = ["tests*", "examples*", "benchmark*", "scripts*", "docs*"]

[tool.setuptools.package-data]
difflet = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py312"]
extend-exclude = '''
/(
    difflet/layers/.*
    | difflet/utils/.*
    | difflet/models/flux/.*
)/
'''
# Reason: forked-from-NxDI files keep upstream formatting until first rebase
# to minimize merge conflicts. New code under difflet/pipeline/, difflet/registry.py,
# and new model dirs (wan/, hunyuan_video/, etc.) is black-formatted.

[tool.isort]
profile = "black"
line_length = 100
skip_glob = [
    "difflet/layers/*",
    "difflet/utils/*",
    "difflet/models/flux/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F401", "F821"]   # match sglang's narrow ruff config

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short --strict-markers --import-mode=importlib"
markers = [
    "slow: marks tests as slow (run with -m slow)",
    "neuron: requires NeuronCore hardware",
    "numerical: numerical correctness vs HF diffusers reference",
]

# Coverage is measured over the CPU-executable, first-party surface of difflet/.
# The omit list excludes code that is structurally un-runnable on a CPU-only host
# (Trainium NKI kernels, XLA trace/compile paths, Neuron-runtime validation
# utilities) or that needs real model weights. Everything kept in scope is
# reachable via the torch-native CPU backend (DIFFLET_BACKEND=cpu).
[tool.coverage.run]
source = ["difflet"]
omit = [
    "difflet/_version.py",
    # Neuron-runtime / hardware-validation utilities (cannot run on CPU; several
    # fail even to import because they pull in neuronx_distributed_inference models).
    "difflet/utils/accuracy.py",
    "difflet/utils/benchmark.py",
    "difflet/utils/hf_adapter.py",
    "difflet/utils/testing.py",
    "difflet/utils/tensor_capture_utils.py",
    "difflet/utils/constants.py",
    "difflet/utils/debug_utils.py",
    "difflet/utils/profiling.py",
    "difflet/utils/version_utils.py",
    # Trainium NKI-kernel / XLA-trace backend implementations (hardware-only).
    "difflet/backends/trainium/*",
    "difflet/backends/trainium/**/*",
    # Unimplemented GPU backends (stubs).
    "difflet/backends/cuda/*",
    "difflet/backends/rocm/*",
    # Full diffusers pipelines that require real model weights to execute.
    "difflet/models/flux/pipeline.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "def __repr__",
]
