[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "difflet-diffusion"
version = "0.0.0.dev0"
description = "Trainium3-native diffusion inference framework"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
]

# difflet is installed with `pip install -e .` INTO the pre-built Neuron venv
# (/opt/aws_neuronx_venv_pytorch_2_9_nxd_inference), which already provides the
# Neuron toolchain (torch, torch-neuronx, torch-xla, neuronx-cc,
# neuronx-distributed, nki, libneuronxla) and the HuggingFace stack
# (transformers, huggingface_hub, safetensors, tokenizers, sentencepiece,
# numpy, Pillow). Those are deliberately NOT listed here: pinning them made
# `pip install -e .` downgrade the venv's Neuron packages to older builds.
# Only declare what the venv does not already supply.
#
# The Neuron venv is a hard requirement for difflet — this file is not a
# standalone install spec and installing outside that venv is unsupported.
dependencies = [
    "diffusers==0.38.0",                          # pinned: pipeline/transformer forks track this exact API
    "av",                                         # video I/O (Wan/Hunyuan output) — difflet/serving/video_media.py
    "imageio-ffmpeg",                             # ffmpeg binary for video encoding
    "accelerate",                                 # used by diffusers' from_pretrained weight loading

    # Serving stack — `difflet serve` is part of the CLI, so these are required,
    # not optional. fastapi and boto3 are already in the venv; listed anyway to
    # document the floor.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.35",                    # difflet/cli/serve.py
    "python-multipart>=0.0.20",                   # Starlette request.form() — serving_video.py:133
    "boto3>=1.34",                                # S3 artifact store — artifact_store.py:156
    "python-dotenv>=1.0",                         # .env loading — serve.py:248
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-xdist",
    "expecttest",
    "imageio",
    "imageio-ffmpeg",
]
dev = [
    "difflet-diffusion[test]",
    "black==26.1.0",
    "isort==8.0.1",
    "ruff==0.15.1",
    "mypy==1.18.2",
    "libcst",                                     # AST-level import rewriter (M0.5)
    "pre-commit",
]

[project.urls]
"Source" = "https://github.com/<org>/difflet-diffusion"          # placeholder
"Tracker" = "https://github.com/<org>/difflet-diffusion/issues"  # placeholder

[project.scripts]
difflet = "difflet.cli.main:main"

[tool.setuptools.packages.find]
include = ["difflet*"]
exclude = ["tests*", "examples*", "benchmark*", "scripts*", "docs*"]

[tool.setuptools.package-data]
difflet = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py312"]
extend-exclude = '''
/(
    difflet/layers/.*
    | difflet/utils/.*
    | difflet/models/flux/.*
)/
'''
# Reason: forked-from-NxDI files keep upstream formatting until first rebase
# to minimize merge conflicts. New code under difflet/pipeline/, difflet/registry.py,
# and new model dirs (wan/, hunyuan_video/, etc.) is black-formatted.

[tool.isort]
profile = "black"
line_length = 100
skip_glob = [
    "difflet/layers/*",
    "difflet/utils/*",
    "difflet/models/flux/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F401", "F821"]   # match sglang's narrow ruff config

[tool.mypy]
python_version = "3.10"
show_error_codes = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_return_any = false
warn_unused_ignores = true
no_implicit_optional = true
pretty = true

[[tool.mypy.overrides]]
module = ["difflet.serving.*", "difflet.pipeline.difflet_pipeline", "difflet.pipeline.teacache"]
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["difflet.cli.*", "difflet.common.orchestrators.*", "difflet.common.registry.*", "tests.unit.serving.*"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short --strict-markers --import-mode=importlib"
markers = [
    "slow: marks tests as slow (run with -m slow)",
    "neuron: requires NeuronCore hardware",
    "numerical: numerical correctness vs HF diffusers reference",
]

# Coverage is measured over the CPU-executable, first-party surface of difflet/.
# The omit list excludes code that is structurally un-runnable on a CPU-only host
# (Trainium NKI kernels, XLA trace/compile paths, Neuron-runtime validation
# utilities) or that needs real model weights. Everything kept in scope is
# reachable via the torch-native CPU backend (DIFFLET_BACKEND=cpu).
[tool.coverage.run]
source = ["difflet"]
omit = [
    "difflet/_version.py",
    # Neuron-runtime / hardware-validation utilities (cannot run on CPU; several
    # fail even to import because they pull in neuronx_distributed_inference models).
    "difflet/utils/accuracy.py",
    "difflet/utils/benchmark.py",
    "difflet/utils/hf_adapter.py",
    "difflet/utils/testing.py",
    "difflet/utils/tensor_capture_utils.py",
    "difflet/utils/constants.py",
    "difflet/utils/debug_utils.py",
    "difflet/utils/profiling.py",
    "difflet/utils/version_utils.py",
    # Trainium NKI-kernel / XLA-trace backend implementations (hardware-only).
    "difflet/backends/trainium/*",
    "difflet/backends/trainium/**/*",
    # Unimplemented GPU backends (stubs).
    "difflet/backends/cuda/*",
    "difflet/backends/rocm/*",
    # Full diffusers pipelines that require real model weights to execute.
    "difflet/models/flux/pipeline.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "def __repr__",
]
